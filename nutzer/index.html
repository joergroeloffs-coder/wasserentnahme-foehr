<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1116">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../vendor/leaflet.css">
<title>Wasserentnahmestellen</title>
<style>
  :root{
    --bg:#0d1116;
    --panel:#161d25;
    --panel-2:#1e2833;
    --line:#2b3743;
    --text:#e6edf3;
    --dim:#93a3b3;
    --signal:#e23c22;
    --ok:#3fb26a;
    --warn:#e8a020;
    --touch:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{overflow-x:hidden}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
    font-size:17px;line-height:1.35;
    display:flex;flex-direction:column;
    overscroll-behavior:none;
    overflow-x:hidden;
    width:100%;
  }
  header{
    padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;flex:none;
  }
  header>div:first-child{min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  #zugangsnummer,#kachel-status{overflow-wrap:anywhere}
  #gps{margin-left:auto;flex:none;font-size:13px;color:var(--dim);text-align:right;line-height:1.2;max-width:92px}
  #gps b{display:block;font-size:15px;font-weight:600}
  .fix-ok b{color:var(--ok)} .fix-bad b{color:var(--warn)}
  #sync-jetzt, #pos-teilen{
    flex:none;width:40px;height:40px;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);font-size:19px;cursor:pointer;
  }

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view{display:none;padding:12px 14px 24px}
  .view.on{display:block}

  nav{
    flex:none;display:grid;grid-template-columns:repeat(2,1fr);
    background:var(--panel);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    background:none;border:0;color:var(--dim);font:inherit;font-size:14px;
    padding:14px 2px;min-height:var(--touch);cursor:pointer;
  }
  nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--signal)}

  /* Karte */
  #v-karte{padding:0}
  #map{width:100%;height:calc(100vh - 118px);height:calc(100dvh - 118px);background:#1a232c}
  .karte-leiste{
    position:absolute;left:0;right:0;top:0;z-index:1000;padding:10px 14px 10px 58px;
    display:flex;gap:8px;align-items:center;background:linear-gradient(#0d1116cc,transparent);
  }
  .karte-leiste select{
    width:auto;min-height:44px;padding:8px 30px 8px 12px;font-size:14px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
  }

  input,select,textarea,button{font:inherit}
  input,select{
    width:100%;background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:12px;min-height:var(--touch);
  }
  label{display:block;margin:14px 0 5px;font-size:14px;color:var(--dim)}
  .btn{
    display:block;width:100%;min-height:var(--touch);border:0;border-radius:6px;
    background:var(--panel-2);color:var(--text);padding:14px;cursor:pointer;
    border:1px solid var(--line);
  }
  .btn.primary{background:var(--signal);border-color:var(--signal);font-weight:600}
  .btn.ghost{background:none}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  /* Liste */
  #suche{margin-bottom:10px}
  .item{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;min-height:var(--touch);cursor:pointer;color:inherit;
  }
  .item .dist{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:92px}
  .item .meta{font-size:14px;color:var(--dim);margin-top:2px}
  .item .name{font-size:17px}
  .tag{
    font-size:12px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);
    color:var(--dim);margin-left:8px;white-space:nowrap;
  }
  .empty{color:var(--dim);padding:28px 4px;font-size:16px}
  .anleitung-link{
    display:block;text-align:center;margin-top:18px;color:var(--dim);
    font-size:14px;text-decoration:none;
  }

  /* Peilung: Karte vollflächig, Bedienelemente nur bei Berührung */
  #peil{display:none}
  #peil.on{
    display:block;position:fixed;inset:0;z-index:1500;background:var(--bg);
  }
  #peilMap{width:100%;height:100%;background:#1a232c}
  .peil-overlay{
    position:fixed;inset:0;z-index:1600;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    opacity:0;transition:opacity .25s ease;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .peil-overlay.sichtbar{opacity:1;pointer-events:auto}
  .peil-oben{
    position:relative;pointer-events:auto;padding:64px 88px 18px 14px;
    background:linear-gradient(#0d1116ee, #0d1116aa 60%, transparent);
  }
  .peil-zurueck-btn{
    position:fixed;left:14px;top:calc(10px + env(safe-area-inset-top));z-index:1700;
    width:auto;min-height:44px;padding:10px 18px;background:#0d1116cc;
  }
  .peil-unten{
    pointer-events:auto;padding:18px 14px 14px;
    background:linear-gradient(transparent, #0d1116aa 40%, #0d1116ee);
  }
  .ziel{font-size:20px;font-weight:600;margin-bottom:2px}
  .ziel-meta{color:var(--dim);font-size:14px}
  .abstand{text-align:center;margin-top:4px}
  .abstand .m{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .abstand .u{color:var(--dim);font-size:14px}
  .hinweis{
    margin-top:16px;padding:12px;border-radius:6px;background:var(--panel);
    border:1px solid var(--line);font-size:14px;color:var(--dim);
  }
  .koord{font-variant-numeric:tabular-nums;font-size:15px;color:var(--dim);text-align:center;margin-top:8px}
  .kompass-mini{
    position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:1700;
    width:64px;height:64px;background:#0d1116cc;border:1px solid var(--line);
    border-radius:10px;padding:4px;pointer-events:none;
  }
  .eigene-pos{
    width:16px;height:16px;border-radius:50%;background:#3fa9ff;border:3px solid #fff;
    box-shadow:0 0 0 2px #3fa9ff88;
  }
  .nr-marker-wrap{
    display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);
  }
  .nr-marker{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--pin, var(--signal));color:#fff;font-weight:700;font-size:12px;font-family:system-ui,sans-serif;
    padding:3px 8px;border-radius:6px 6px 3px 3px;white-space:nowrap;box-shadow:0 1px 5px #000a;
  }
  .nr-icon{width:14px;height:14px;flex:none;display:block}
  .nr-spitze{
    width:0;height:0;margin-top:-1px;
    border:9px solid transparent;border-top-width:10px;border-top-color:var(--pin, var(--signal));
  }
  .peil-hinweis-touch{
    position:fixed;left:0;right:0;bottom:14px;text-align:center;z-index:1550;
    color:var(--dim);font-size:13px;pointer-events:none;
  }
  .detail-overlay{
    display:none;position:fixed;inset:0;z-index:1900;background:#000c;
    align-items:flex-end;justify-content:center;padding:0;
  }
  .detail-overlay.on{display:flex}
  .detail-karte{
    background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;
    padding:14px 16px calc(12px + env(safe-area-inset-bottom));width:100%;max-width:480px;
    max-height:calc(100dvh - 24px - env(safe-area-inset-top));
    height:calc(100dvh - 24px - env(safe-area-inset-top));
    overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .detail-karte .ziel{margin-bottom:0;font-size:18px}
  .detail-karte .ziel-meta{font-size:13px}
  #detailMap{
    width:100%;height:clamp(140px,24vh,220px);flex:none;border-radius:8px;margin-bottom:10px;
    background:#1a232c;
  }
  .detail-karte .koord{font-size:13px;margin-top:6px!important}
  .detail-karte .hinweis{margin-top:8px;padding:10px;font-size:13px}
  .detail-karte .navfrage{margin:12px 0 8px;color:var(--dim);font-size:14px}
  .detail-karte .row{flex:none}
  .detail-karte .row .btn,.detail-karte>#detail-korrektur{min-height:48px;padding:11px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Wasserentnahmestellen</h1>
    <div id="zugangsnummer" style="font-size:11px;color:var(--dim);margin-top:2px"></div>
    <div id="kachel-status" style="font-size:11px;color:var(--dim);margin-top:2px"></div>
  </div>
  <div id="gps" class="fix-bad"><b>kein GPS</b><span id="gpsdetail">warte auf Position</span></div>
  <button id="pos-teilen" title="Eigene Position teilen" aria-label="Eigene Position teilen">⌖</button>
  <button id="sync-jetzt" title="Jetzt aktualisieren" aria-label="Jetzt aktualisieren">⟳</button>
</header>

<main>
  <!-- Detailansicht: Punktdaten anzeigen, dann Ja/Nein zur Navigation -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-karte">
      <div id="detailMap"></div>
      <div class="ziel" id="detailName">–</div>
      <div class="ziel-meta" id="detailMeta"></div>
      <div class="koord" id="detailKoord" style="text-align:left;margin-top:10px"></div>
      <div class="hinweis" id="detailHinweis"></div>
      <p class="navfrage">Zu diesem Punkt navigieren?</p>
      <div class="row">
        <button class="btn primary" id="detail-ja">Ja, navigieren</button>
        <button class="btn ghost" id="detail-nein">Nein</button>
      </div>
      <button class="btn ghost" id="detail-korrektur" style="margin-top:8px">Eigene Position als Korrektur teilen</button>
    </div>
  </div>

  <!-- Peilansicht (Navigation): Karte vollflächig, Pfeil dauerhaft sichtbar, Rest nur bei Berührung -->
  <section id="peil">
    <div id="peilMap"></div>
    <svg class="kompass-mini" id="kompassMini" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="94" fill="#161d25" stroke="#2b3743" stroke-width="2"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#2b3743" stroke-width="1"/>
      <g id="ring">
        <text x="100" y="30" text-anchor="middle" fill="#93a3b3" font-size="26" font-family="system-ui">N</text>
      </g>
      <g id="pfeil">
        <path d="M100 26 L128 122 L100 104 L72 122 Z" fill="#e23c22"/>
      </g>
      <circle cx="100" cy="100" r="5" fill="#0d1116" stroke="#2b3743"/>
    </svg>
    <button class="btn ghost peil-zurueck-btn" id="zurueck">Zurück</button>
    <div class="peil-hinweis-touch" id="peilTouchHinweis">Bildschirm berühren für Details · Verschieben mit zwei Fingern</div>
    <div class="peil-overlay" id="peilOverlay">
      <div class="peil-oben">
        <div class="ziel" id="zielName">–</div>
        <div class="ziel-meta" id="zielMeta"></div>
      </div>
      <div class="peil-unten">
        <div class="abstand"><div class="m" id="abstandM">–</div><div class="u" id="abstandU">Meter Luftlinie</div></div>
        <div class="koord" id="zielKoord"></div>
        <div class="hinweis" id="peilHinweis"></div>
      </div>
    </div>
  </section>

  <!-- Karte -->
  <section id="v-karte" class="view" style="position:relative">
    <div class="karte-leiste">
      <select id="karte-ortschaft-filter"><option value="">Alle Ortschaften</option></select>
    </div>
    <div id="map"></div>
  </section>

  <!-- Liste -->
  <section id="v-liste" class="view on">
    <input id="suche" type="search" placeholder="Nummer, Straße oder Lage suchen" autocomplete="off">
    <div class="row" style="margin-top:8px">
      <div>
        <label for="f-ortschaft-filter" style="margin:0 0 5px">Ortschaft</label>
        <select id="f-ortschaft-filter"><option value="">Alle Ortschaften</option></select>
      </div>
      <div>
        <label for="f-typ-filter" style="margin:0 0 5px">Art</label>
        <select id="f-typ-filter"><option value="">Alle Arten</option></select>
      </div>
    </div>
    <div id="liste" style="margin-top:10px"></div>
    <a class="anleitung-link" href="../anleitung/index.html">Anleitung ansehen</a>
  </section>
</main>

<nav>
  <button data-view="v-liste" class="on">Suchen</button>
  <button data-view="v-karte">Karte</button>
</nav>

<script src="../vendor/leaflet.js"></script>
<script>
"use strict";

/* ---------- Testzeitraum: 62 Tage ab erstem Öffnen auf diesem Gerät ---------- */
(function trialPruefen(){
  const TRIAL_TAGE = 62;
  const TRIAL_KEY = "wasserentnahme.nutzer.trialstart";
  let start;
  try {
    const gespeichert = localStorage.getItem(TRIAL_KEY);
    if(gespeichert){ start = Number(gespeichert); }
    else { start = Date.now(); localStorage.setItem(TRIAL_KEY, String(start)); }
  } catch(e){ start = Date.now(); }
  const ablauf = start + TRIAL_TAGE * 24 * 60 * 60 * 1000;
  if(Date.now() > ablauf){
    document.body.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center;background:#0d1116;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif">' +
      '<h1 style="font-size:20px;margin:0 0 12px">Testzeitraum abgelaufen</h1>' +
      '<p style="color:#93a3b3;max-width:320px;margin:0">Der ' + TRIAL_TAGE + '-tägige Testzeitraum dieser Version ist beendet. Bei Interesse an einer dauerhaften Nutzung bitte den Admin kontaktieren.</p>' +
      '</div>';
    throw new Error("Testzeitraum abgelaufen");
  }
})();

/* ---------- Zugangsnummer: rein kosmetisch, keine echte Prüfung ---------- */
(function zugangsnummerAnzeigen(){
  const ZN_KEY = "wasserentnahme.nutzer.zugangsnummer";
  try {
    const ausUrl = new URLSearchParams(window.location.search).get("zugang");
    let nr = null;
    if(ausUrl && /^\d{8,}$/.test(ausUrl)){
      nr = ausUrl;
      localStorage.setItem(ZN_KEY, nr);
    } else {
      nr = localStorage.getItem(ZN_KEY);
      if(!nr){
        nr = String(Math.floor(10000000 + Math.random() * 90000000));
        localStorage.setItem(ZN_KEY, nr);
      }
    }
    const el = document.getElementById("zugangsnummer");
    if(el) el.textContent = "Zugang Nr. " + nr;
  } catch(e){}
})();

const KEY = "wasserentnahme.foehr.v1";

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ---------- Speicher: localStorage mit Rückfall auf Arbeitsspeicher ---------- */
const store = {
  persistent: (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })(),
  mem: [],
  load(){ if(this.persistent){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ return []; } } return this.mem; },
  save(d){ if(this.persistent){ try { localStorage.setItem(KEY, JSON.stringify(d)); return; } catch(e){} } this.mem = d; }
};
let stellen = store.load();

/* ---------- Geometrie ---------- */
const R = 6371008.8, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function distanz(a,b,c,d){
  const p=rad(a),q=rad(c),dp=rad(c-a),dl=rad(d-b);
  const x=Math.sin(dp/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function peilung(a,b,c,d){
  const p=rad(a),q=rad(c),dl=rad(d-b);
  const y=Math.sin(dl)*Math.cos(q);
  const x=Math.cos(p)*Math.sin(q)-Math.sin(p)*Math.cos(q)*Math.cos(dl);
  return (deg(Math.atan2(y,x))+360)%360;
}
const fmtDist = m => m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km";

/* ---------- GPS ---------- */
let pos = null;
let letzterListenRedraw = 0;
const gpsBox = document.getElementById("gps");
const gpsDetail = document.getElementById("gpsdetail");

if("geolocation" in navigator){
  navigator.geolocation.watchPosition(p => {
    pos = p.coords;
    gpsBox.classList.toggle("fix-ok", p.coords.accuracy <= 15);
    gpsBox.classList.toggle("fix-bad", p.coords.accuracy > 15);
    gpsBox.querySelector("b").textContent = "±" + Math.round(p.coords.accuracy) + " m";
    gpsDetail.textContent = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5);
    if(typeof p.coords.heading === "number" && !isNaN(p.coords.heading) && p.coords.speed > 1) gpsKurs = p.coords.heading;
    aktualisierePeil();
    const jetzt = Date.now();
    if(jetzt - letzterListenRedraw > 1500){ letzterListenRedraw = jetzt; zeichneListe(); }
  }, err => {
    gpsBox.querySelector("b").textContent = "kein GPS";
    gpsDetail.textContent = err.code === 1 ? "Zugriff verweigert" : "kein Empfang";
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
} else {
  gpsDetail.textContent = "vom Gerät nicht unterstützt";
}

/* ---------- Kompass ---------- */
let kompass = null, gpsKurs = null, kompassAktiv = false;
function orientierung(e){
  let h = null;
  if(typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360;
  if(h !== null){ kompass = h; kompassAktiv = true; aktualisierePeil(); }
}
window.addEventListener("deviceorientationabsolute", orientierung, true);
window.addEventListener("deviceorientation", orientierung, true);

/* ---------- Ansichten ---------- */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.getElementById("peil").classList.remove("on");
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === b.dataset.view));
  if(b.dataset.view === "v-karte"){ initKarte(); setTimeout(() => map.invalidateSize(), 50); }
  if(b.dataset.view === "v-liste"){ aktualisiereFilterListen(); zeichneListe(); }
}));

/* ---------- Liste ---------- */
const listeEl = document.getElementById("liste");
const sucheEl = document.getElementById("suche");
const ortschaftFilterEl = document.getElementById("f-ortschaft-filter");
const typFilterEl = document.getElementById("f-typ-filter");
sucheEl.addEventListener("input", zeichneListe);
ortschaftFilterEl.addEventListener("change", zeichneListe);
typFilterEl.addEventListener("change", zeichneListe);

const ORTSCHAFT_GRUPPEN = {
  "Utersum": "Utersum / Dunsum / Witsum / Hedehusum",
  "Dunsum": "Utersum / Dunsum / Witsum / Hedehusum",
  "Witsum": "Utersum / Dunsum / Witsum / Hedehusum",
  "Hedehusum": "Utersum / Dunsum / Witsum / Hedehusum",
  "Nieblum": "Nieblum / Goting",
  "Goting": "Nieblum / Goting"
};
function ortschaftGruppe(o){ return ORTSCHAFT_GRUPPEN[o] || o; }

function ortschaften(){
  return [...new Set(stellen.map(s => ortschaftGruppe((s.ortschaft || "").trim())).filter(Boolean))].sort((a,b) => a.localeCompare(b, "de"));
}

const TYP_GRUNDLISTE = ["Unterflurhydrant","Überflurhydrant","Saugstelle","Löschwasserbrunnen","Zisterne","Defibrillator"];
function typen(){
  const benutzt = stellen.map(s => (s.typ || "").trim()).filter(Boolean);
  return [...new Set([...TYP_GRUNDLISTE, ...benutzt])].sort((a,b) => a.localeCompare(b, "de"));
}

function aktualisiereFilterListen(){
  const werte = ortschaften();
  const aktuellerFilter = ortschaftFilterEl.value;
  ortschaftFilterEl.innerHTML = '<option value="">Alle Ortschaften</option>' +
    werte.map(o => '<option value="' + esc(o) + '">' + esc(o) + "</option>").join("");
  if(werte.includes(aktuellerFilter)) ortschaftFilterEl.value = aktuellerFilter;

  const typWerte = typen();
  const aktuellerTypFilter = typFilterEl.value;
  typFilterEl.innerHTML = '<option value="">Alle Arten</option>' +
    typWerte.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("");
  if(typWerte.includes(aktuellerTypFilter)) typFilterEl.value = aktuellerTypFilter;
}

function zeichneListe(){
  if(document.getElementById("peil").classList.contains("on")) return;
  if(!document.getElementById("v-liste").classList.contains("on")) return;
  const q = sucheEl.value.trim().toLowerCase();
  const ortschaftFilter = ortschaftFilterEl.value;
  const typFilter = typFilterEl.value;
  let d = stellen.slice();
  if(q) d = d.filter(s => (s.nr+" "+s.ort+" "+(s.ortschaft||"")+" "+s.typ+" "+(s.bem||"")).toLowerCase().includes(q));
  if(ortschaftFilter) d = d.filter(s => ortschaftGruppe((s.ortschaft || "").trim()) === ortschaftFilter);
  if(typFilter) d = d.filter(s => s.typ === typFilter);
  if(pos) d.forEach(s => s._d = distanz(pos.latitude,pos.longitude,s.lat,s.lon));
  d.sort((a,b) => pos ? a._d-b._d : (a.nr||"").localeCompare(b.nr||""));

  if(!d.length){
    listeEl.innerHTML = '<div class="empty">' +
      (stellen.length ? "Kein Treffer für diese Suche/Filter." : "Noch keine Daten geladen. Auf ⟳ oben rechts tippen (Internet nötig).") +
      "</div>";
    return;
  }
  listeEl.innerHTML = "";
  d.slice(0,200).forEach(s => {
    const b = document.createElement("button");
    b.className = "item";
    const ortLage = [s.ortschaft, s.ort].filter(Boolean).join(" · ") || s.typ;
    b.innerHTML =
      '<span class="dist">' + (pos ? fmtDist(s._d) : "–") + '</span>' +
      '<span><span class="name">' + esc(s.nr || "ohne Nummer") + '</span>' +
      (s.dn ? '<span class="tag">' + esc(s.dn) + '</span>' : "") +
      '<div class="meta">' + esc(ortLage) + '</div></span>';
    b.addEventListener("click", () => zeigeDetails(s));
    listeEl.appendChild(b);
  });
}
const esc = t => String(t == null ? "" : t).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

let peilMap = null, peilZielMarker = null, peilEigenMarker = null, peilLinie = null;
let peilAutoZoom = true;

function initPeilMap(){
  if(peilMap) return;
  L.Icon.Default.imagePath = "../vendor/images/";
  peilMap = L.map("peilMap", { zoomControl:false }).setView([54.693, 8.530], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'
  }).addTo(peilMap);

  // Verschieben nur mit zwei Fingern (versehentliches Verschieben vermindern)
  peilMap.dragging.disable();
  const container = peilMap.getContainer();
  const zweiFingerCheck = e => {
    if(e.touches.length >= 2){ peilMap.dragging.enable(); peilAutoZoom = false; }
    else peilMap.dragging.disable();
  };
  container.addEventListener("touchstart", e => {
    zweiFingerCheck(e);
    if(e.touches.length === 1) zeigePeilOverlay();
  }, { passive:true });
  container.addEventListener("touchmove", zweiFingerCheck, { passive:true });
  container.addEventListener("touchend", zweiFingerCheck, { passive:true });

  // Desktop/Maus-Test: Klick blendet Bedienelemente ebenfalls ein
  container.addEventListener("click", () => zeigePeilOverlay());
}

/* ---------- Automatischer Abgleich bei Internet/WLAN (immer aktiv) ---------- */
const SYNC_HASH_KEY = "wasserentnahme.foehr.synchash";
const SYNC_ZEIT_KEY = "wasserentnahme.foehr.synczeit";
const SYNC_URL = "../daten/stellen.geojson";

function ortsNameAusDatei(dateiname){
  if(!dateiname) return "";
  let n = dateiname.replace(/\.(geojson|json)$/i, "");
  n = n.replace(/[_\-]+/g, " ");
  n = n.replace(/\b(geodaten|daten|dorf|hydranten|wasserentnahme|stellen|punkte|export|import)\b/gi, "");
  n = n.replace(/\(\s*\d+\s*\)/g, "");
  n = n.replace(/\s+/g, " ").trim();
  if(!n) return "";
  return n.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

function geoJsonZuStellen(j, dateiname){
  const eingelesen = [];
  const ortschaftAusDatei = ortsNameAusDatei(dateiname);
  (j.features || []).forEach(ft => {
    if(!ft.geometry || ft.geometry.type !== "Point") return;
    const p = ft.properties || {}, c = ft.geometry.coordinates;
    let menge = p.flow_rate || p.menge || "";
    if(!menge && typeof p.menge_l_min === "number") menge = p.menge_l_min;
    let bem = p.description || p.bem || "";
    if(!bem && (p.lagegenauigkeit || p.lagehinweis || p.quelle || p.quellkarte)){
      bem = [p.lagegenauigkeit || p.lagehinweis, (p.quelle || p.quellkarte) ? "Quelle: " + (p.quelle || p.quellkarte) : ""].filter(Boolean).join(" · ");
    }
    eingelesen.push({ nr: p.ref || p.nr || p.name || p.id || "", ort: p.name || p.ort || p.addr || "",
      ortschaft: p["addr:city"] || p.ortschaft || p.ortsname || ortschaftAusDatei,
      typ: p.art || p["fire_hydrant:type"] || p.typ || "", dn: p["fire_hydrant:diameter"] || p.dn || "",
      menge: menge, bem: bem,
      lat: c[1], lon: c[0], genau: null, erfasst: p["survey:date"] || "" });
  });
  return eingelesen;
}

function einfacherHash(text){
  let h = 0;
  for(let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
  return h + ":" + text.length;
}

async function serverAbgleich(manuell){
  const btn = document.getElementById("sync-jetzt");
  btn.style.opacity = "0.5";
  try {
    const res = await fetch(SYNC_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("nicht erreichbar");
    const text = await res.text();
    const hash = einfacherHash(text);
    let vorherigerHash = null;
    try { vorherigerHash = localStorage.getItem(SYNC_HASH_KEY); } catch(e){}
    if(!manuell && hash === vorherigerHash) return;
    const eingelesen = geoJsonZuStellen(JSON.parse(text));
    if(!eingelesen.length && stellen.length){
      if(manuell) alert("Serverdatei enthält keine gültigen Punkte, Bestand bleibt unverändert.");
      return;
    }

    stellen = eingelesen;
    store.save(stellen);
    try {
      localStorage.setItem(SYNC_HASH_KEY, hash);
      localStorage.setItem(SYNC_ZEIT_KEY, new Date().toISOString());
    } catch(e){}
    aktualisiereFilterListen(); zeichneListe(); zeichneKarte();
    if(manuell) alert(eingelesen.length + " Stellen aus dem Internet übernommen.");
  } catch(e){
    if(manuell) alert("Kein Abgleich möglich (kein Internet oder Datei nicht erreichbar).");
  } finally {
    btn.style.opacity = "1";
  }
}

document.getElementById("sync-jetzt").addEventListener("click", () => serverAbgleich(true));
window.addEventListener("load", () => { if(navigator.onLine) serverAbgleich(false); });
window.addEventListener("online", () => serverAbgleich(false));

/* ---------- Kartenkacheln automatisch vorladen (für Offline-Nutzung unterwegs) ---------- */
const TILE_CACHE_NAME = "osm-tiles-v1"; // muss zu TILE_CACHE in sw.js passen
const KACHELN_FERTIG_KEY = "wasserentnahme.nutzer.kacheln_vorgeladen";
const FOEHR_BBOX = { west: 8.40, south: 54.64, east: 8.63, north: 54.77 };
const VORLADEN_MIN_ZOOM = 13;
const VORLADEN_MAX_ZOOM = 16;

function tileIndexBereich(zoom, bbox){
  const n = Math.pow(2, zoom);
  const lon2x = lon => Math.floor((lon + 180) / 360 * n);
  const lat2y = lat => {
    const rad = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n);
  };
  return {
    xMin: lon2x(bbox.west), xMax: lon2x(bbox.east),
    yMin: lat2y(bbox.north), yMax: lat2y(bbox.south)
  };
}

function kachelnFuerInsel(maxZoom){
  const liste = [];
  for(let z = VORLADEN_MIN_ZOOM; z <= maxZoom; z++){
    const { xMin, xMax, yMin, yMax } = tileIndexBereich(z, FOEHR_BBOX);
    for(let x = xMin; x <= xMax; x++){
      for(let y = yMin; y <= yMax; y++) liste.push({ z, x, y });
    }
  }
  return liste;
}

async function kachelnImHintergrundVorladen(){
  if(!("caches" in window)) return;
  try { if(localStorage.getItem(KACHELN_FERTIG_KEY) === "1") return; } catch(e){}
  if(!navigator.onLine) return;

  const statusEl = document.getElementById("kachel-status");
  const kacheln = kachelnFuerInsel(VORLADEN_MAX_ZOOM);
  const cache = await caches.open(TILE_CACHE_NAME);
  let fertig = 0, fehler = 0;
  const GLEICHZEITIG = 3;
  let naechsterIndex = 0;

  async function eineKachel(url){
    const abbruch = new AbortController();
    const timeout = setTimeout(() => abbruch.abort(), 8000);
    try {
      const vorhanden = await cache.match(url);
      if(vorhanden) return;
      const res = await fetch(url, { signal: abbruch.signal });
      if(res.ok) await cache.put(url, res);
      else throw new Error("http " + res.status);
    } finally {
      clearTimeout(timeout);
    }
  }

  // Absicherung pro Kachel: egal was hängt (Netzwerk, Cache Storage, …), nach spätestens
  // 10s wird abgebrochen und mit der nächsten Kachel weitergemacht, statt für immer zu warten.
  function mitZeitlimit(promise, ms){
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error("Zeitlimit")), ms);
      promise.then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
    });
  }

  async function naechstesLaden(){
    while(naechsterIndex < kacheln.length){
      const i = naechsterIndex++;
      const { z, x, y } = kacheln[i];
      const url = "https://tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png";
      try {
        await mitZeitlimit(eineKachel(url), 10000);
      } catch(e){ fehler++; }
      fertig++;
      if(statusEl && (fertig % 15 === 0 || fertig === kacheln.length)){
        statusEl.textContent = "Karte für Offline-Nutzung wird geladen: " + fertig + " / " + kacheln.length;
      }
    }
  }

  if(statusEl) statusEl.textContent = "Karte für Offline-Nutzung wird geladen …";
  await Promise.all(Array.from({ length: GLEICHZEITIG }, naechstesLaden));

  const vollstaendigDurchlaufen = naechsterIndex >= kacheln.length;
  const grossteilsErfolgreich = fehler < kacheln.length * 0.1;
  if(vollstaendigDurchlaufen && grossteilsErfolgreich){
    try { localStorage.setItem(KACHELN_FERTIG_KEY, "1"); } catch(e){}
  }
  // sonst: abgebrochen oder zu viele Fehler – beim nächsten Online-Start wird fortgesetzt
  // (schon gecachte Kacheln werden dank cache.match() nicht erneut heruntergeladen)
  if(statusEl) statusEl.textContent = "";
}

window.addEventListener("load", () => { if(navigator.onLine) kachelnImHintergrundVorladen(); });
window.addEventListener("online", () => kachelnImHintergrundVorladen());

aktualisiereFilterListen(); zeichneListe();
</script>
